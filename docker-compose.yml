services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: standards-db
    restart: always
    environment:
      POSTGRES_DB: standards_db
      POSTGRES_USER: standards_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - standards-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standards_user -d standards_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standards-backend
    restart: always
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-jwt-secret}
      - DATABASE_URL=postgresql://standards_user:${DB_PASSWORD:-change_this_password}@postgres:5432/standards_db
      - UPLOAD_FOLDER=/app/uploads/documents
      - PRICE_PER_PAGE=1000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - AI_BACKEND_URL=http://ai-backend:8000
      # Wasabi S3 Storage
      - WASABI_ACCESS_KEY_ID=${WASABI_ACCESS_KEY_ID}
      - WASABI_SECRET_ACCESS_KEY=${WASABI_SECRET_ACCESS_KEY}
      - WASABI_BUCKET_NAME=${WASABI_BUCKET_NAME:-standards}
      - WASABI_REGION=${WASABI_REGION:-eu-central-1}
    volumes:
      - backend-uploads:/app/uploads/documents
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - standards-network

  # Qdrant Vector Database (для AI поиска)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: standards-qdrant
    restart: always
    volumes:
      - qdrant-data:/qdrant/storage
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - standards-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 20s

  # Django AI Backend
  ai-backend:
    build:
      context: ./AI-ready-project/shnq_ai_backend
      dockerfile: Dockerfile
    container_name: standards-ai-backend
    restart: always
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DATABASE_URL=postgresql://standards_user:${DB_PASSWORD:-change_this_password}@postgres:5432/standards_ai_db
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ai-media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    networks:
      - standards-network

  # React Frontend (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: standards-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
      - ai-backend
    networks:
      - standards-network

networks:
  standards-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  qdrant-data:
    driver: local
  ai-media:
    driver: local
  backend-uploads:
    driver: local
