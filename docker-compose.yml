version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: standards-db
    restart: always
    environment:
      POSTGRES_DB: standards_db
      POSTGRES_USER: standards_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change_this_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - standards-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U standards_user -d standards_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Flask Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: standards-backend
    restart: always
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-this-secret}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-jwt-secret}
      - DATABASE_URL=postgresql://standards_user:${DB_PASSWORD:-change_this_password}@postgres:5432/standards_db
      - UPLOAD_FOLDER=/app/uploads/documents
      - PRICE_PER_PAGE=1000
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
    volumes:
      - ./backend/uploads/documents:/app/uploads/documents
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - standards-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: standards-nginx
    restart: always
    volumes:
      - ./nginx/conf/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/logs:/var/log/nginx
      - ./frontend/dist:/usr/share/nginx/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - standards-network

networks:
  standards-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
